          - generic [ref=f4e338]: This page has not been upgraded to Quantum 3.0 yet. The information may be out of date.
          - heading "Fixed Point" [level=1] [ref=f4e344]
          - heading "Introduction" [level=2] [ref=f4e345]
          - paragraph [ref=f4e346]:
            - text: In Quantum the
            - code [ref=f4e347]: FP
            - text: struct (Fixed Point) completely replaces all usages of
            - code [ref=f4e348]: floats
            - text: and
            - code [ref=f4e349]: doubles
            - text: to ensure cross-platform determinism. It offers versions of common math data structures like FPVector2, FPVector3, FPMatrix, FPQuaternion, RNGSession, FPBounds2, etc. All systems in Quantum, including physics and navigation, exclusively use
            - code [ref=f4e350]: FP
            - text: values in their computations.
          - paragraph [ref=f4e351]:
            - text: The fixed-point type implemented in Quantum is
            - code [ref=f4e352]: Q48.16
            - text: . It has proved to a good balance between precision and performance with a bias towards the latter.
          - paragraph [ref=f4e353]:
            - text: Internally
            - code [ref=f4e354]: FP
            - text: uses one long to represent the combined fixed-point number (whole number + decimal part); the long value can be accessed and set via
            - code [ref=f4e355]: FP.RawValue
            - text: .
          - paragraph [ref=f4e356]:
            - text: Quantum's FP Math uses carefully tuned look up tables for fast trigonometric and square root functions (see
            - code [ref=f4e357]: Assets/Photon/Quantum/Resources/LUT
            - text: ).
          - heading "Parsing FPs" [level=2] [ref=f4e358]
          - paragraph [ref=f4e359]:
            - text: The representable
            - code [ref=f4e360]: FP
            - text: fraction is limited and never as accurate as a
            - code [ref=f4e361]: double
            - text: . Parsing is an approximation and will round to the nearest possible
            - code [ref=f4e362]: FP
            - text: "precision. This is reflected in:"
          - list [ref=f4e363]:
            - listitem [ref=f4e364]:
              - text: parsing an
              - code [ref=f4e365]: FP
              - text: as the
              - code [ref=f4e366]: float
              - code [ref=f4e367]: 1.1f
              - text: and then converting back to
              - code [ref=f4e368]: float
              - text: possibly resulting in
              - code [ref=f4e369]: 1.09999999f
              - text: ; and,
            - listitem [ref=f4e370]:
              - text: different parsing methods yielding different results on the same machine.
              - paragraph [ref=f4e371]: C#
              - code [ref=f4e373]: FP.FromFloat_UNSAFE(1.1f).RawValue != FP.FromString("1.1").RawValue
          - heading "TLDR" [level=3] [ref=f4e374]
          - list [ref=f4e375]:
            - listitem [ref=f4e376]: Use from float only during edit time, never inside the simulation or at runtime.
            - listitem [ref=f4e377]: It is best to convert from raw whenever possible.
          - heading "FP.FromFloat_UNSAFE()" [level=3] [ref=f4e378]
          - paragraph [ref=f4e379]:
            - text: Converting from
            - code [ref=f4e380]: float
            - text: is not deterministic due to rounding errors and should
            - strong [ref=f4e381]: never
            - text: be done inside the simulation. Doing such a conversion in the simulation will cause desyncs 100% of the time.
          - paragraph [ref=f4e382]:
            - text: However, it can be used during
            - strong [ref=f4e383]: edit
            - text: or
            - strong [ref=f4e384]: build time
            - text: ", when the converted (FP) data is first created and then shared with everyone."
            - strong [ref=f4e385]: "IMPORTANT:"
            - text: Data generated this way on
            - strong [ref=f4e386]: different
            - text: machines may not be compatible.
          - paragraph [ref=f4e387]: C#
          - code [ref=f4e389]:
            - generic [ref=f4e390]: var
            - text: v = FP.FromFloat_UNSAFE(1.1f);
          - heading "FP.FromString_UNSAFE()" [level=3] [ref=f4e391]
          - paragraph [ref=f4e392]:
            - text: This will internally parse the
            - code [ref=f4e393]: string
            - text: as a float and then convert to
            - code [ref=f4e394]: FP
            - text: . All caveats from
            - code [ref=f4e395]: FromFloat_UNSAFE()
            - text: apply here as well.
          - paragraph [ref=f4e396]: C#
          - code [ref=f4e398]:
            - generic [ref=f4e399]: var
            - text: v = FP.FromFloat_UNSAFE("1.1");
          - heading "FP.FromString()" [level=3] [ref=f4e400]
          - paragraph [ref=f4e401]: This is deterministic and therefore safe to use anywhere but may not be the most performant option. A typical use case is balancing information (patch) that clients load from a server and then use to update data in Quantum assets.
          - paragraph [ref=f4e402]: Be aware of the string locale! It only parses English number formatting for decimals and requires a dot (e.g. 1000.01f).
          - paragraph [ref=f4e403]: C#
          - code [ref=f4e405]:
            - generic [ref=f4e406]: var
            - text: v = FP.FromFloat("1.1");
          - heading "FP.FromRaw()" [level=3] [ref=f4e407]
          - paragraph [ref=f4e408]: This is secure and fast as it mimics the internal representation.
          - paragraph [ref=f4e409]: C#
          - code [ref=f4e411]:
