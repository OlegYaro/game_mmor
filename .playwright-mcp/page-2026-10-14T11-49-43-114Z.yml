          - heading "Inlining" [level=2] [ref=f4e515]
          - paragraph [ref=f4e516]:
            - text: All low-level Quantum systems use manual inlined
            - code [ref=f4e517]: FP
            - text: arithmetic to extract every ounce of performance possible. Fixed point math uses integer division and multiplication. To achieve this, the result or dividend are bit-shifted by the FP-Precision (16) before or after the calculation.
