          - heading "Const Variables" [level=2] [ref=f4e426]
          - paragraph [ref=f4e433]:
            - text: The
            - code [ref=f4e434]: FP._1_10
            - text: syntax can not be extended or generated.
          - paragraph [ref=f4e435]:
            - code [ref=f4e436]: FP
            - text: is a struct and can therefore not be used as a constant. It is, however, possible to hard-code and use "
            - code [ref=f4e437]: FP
            - text: "\" values in"
