          - code [ref=f4e532]: "FP.UseableMax Decimal: 32767.9999847412 Raw: 2147483647 Binary: 1111111111111111111111111111111 = 31 bit"
          - paragraph
          - code [ref=f4e534]: "FP.UseableMin Decimal: -32768 Raw: -2147483648 Binary: 10000000000000000000000000000000 = 32 bit"
          - heading "Precision" [level=2] [ref=f4e535]
          - paragraph [ref=f4e536]:
            - text: The general
            - code [ref=f4e537]: FP
            - text: precision is decent when the numbers are kept within a certain range
            - code [ref=f4e538]: (0.01..1000)
            - text: . FP-math related precision problems usually produce inaccurate results and tend to make systems (based on math) unstable. A very common case is to multiply very high or small numbers and than returning to the original range by division for example. The resulting numbers lose precision.
          - paragraph [ref=f4e539]:
            - text: Another example is this method excerpt from
            - code [ref=f4e540]: ClosestDistanceToTriangle
            - text: . Where
            - code [ref=f4e541]: t0
            - text: is calculated from multiplying two dot products with each other, where a dot-product is already also a result of multiplications. This is a problem when very accurate results are expected. A way to mitigate this issue is shifting the values artificially before the calculation then shift the result back. This will work when the ranges of the input are somewhat known.
          - paragraph [ref=f4e542]: C#
          - code [ref=f4e544]:
            - generic [ref=f4e545]: var
            - text: diff = p - v0;
            - generic [ref=f4e546]: var
            - text: edge0 = v1 - v0;
            - generic [ref=f4e547]: var
            - text: edge1 = v2 - v0;
            - generic [ref=f4e548]: var
            - text: a00 = Dot(edge0, edge0);
            - generic [ref=f4e549]: var
            - text: a01 = Dot(edge0, edge1);
            - generic [ref=f4e550]: var
            - text: a11 = Dot(edge1, edge1);
            - generic [ref=f4e551]: var
            - text: b0 = -Dot(diff, edge0);
            - generic [ref=f4e552]: var
            - text: b1 = -Dot(diff, edge1);
            - generic [ref=f4e553]: var
            - text: t0 = a01 * b1 - a11 * b0;
            - generic [ref=f4e554]: var
            - text: t1 = a01 * b0 - a00 * b1; // ... closestPoint = v0 + t0 * edge0 + t1 * edge1;
          - heading "FPAnimationCurves" [level=2] [ref=f4e555]
          - paragraph [ref=f4e556]: Unity comes with a set of tools which are useful to express some values in the form of curves. It comes with a custom editor for such curves, which are then serialised and can be used in runtime in order to evaluate the value of the curve in some specific point.
          - paragraph [ref=f4e557]: There are many situations where curves can be used, such as expressing steering information when implementing vehicles, the utility value during the decision making for an AI agent (as done in Bot SDK's Utility Theory), getting the multiplier value for some attack's damage, and so on.
          - paragraph [ref=f4e558]:
            - text: The Quantum SDK already comes with its own implementation of an animation curve, named
            - code [ref=f4e559]: FPAnimationCurve
            - text: ", evaluated as FPs. This custom type, when inspected directly on Data Assets and Components in Unity, are drawn with Unity's default Animation Curve editors, whose data are then internally baked into the deterministic type."
          - heading "Polling data from an FPAnimationCurve" [level=3] [ref=f4e560]
          - paragraph [ref=f4e561]: "The code needed to poll some data from a curve, with Quantum code, is very similar to the Unity's version:"
          - paragraph [ref=f4e562]: C#
          - code [ref=f4e564]: // This returns the pre-baked value, interpolated accordingly to the curve's configuration such as it's key points, curve's resolution, tangets modes, etc FP myValue = myCurve.Evaluate(FP._0_50);
          - heading "Creating FPAnimationCurves directly on the simulation" [level=3] [ref=f4e565]
          - paragraph [ref=f4e566]: "Here are the snippets to create a deterministic animation curve from scratch, directly on the simulation:"
          - paragraph [ref=f4e567]: C#
          - code [ref=f4e569]:
            - text: "// Creating a simple, linear curve with five key points // Change the parameter as prefered public static class FPAnimationCurveUtils { public static FPAnimationCurve CreateLinearCurve("
            - generic [ref=f4e570]: FPAnimationCurve.WrapMode
            - text: preWrapMode,
            - generic [ref=f4e571]: FPAnimationCurve.WrapMode
            - text: "postWrapMode) { return new FPAnimationCurve { Samples = new FP[5] { FP._0, FP._0_25, FP._0_50, FP._0_75, FP._1 }, PostWrapMode = (int)postWrapMode, PreWrapMode = (int)preWrapMode, StartTime = 0, EndTime = 1, Resolution = 32 }; } }"
          - paragraph [ref=f4e572]: C#
          - code [ref=f4e574]:
            - text: // Storing a curve into a local variable
            - generic [ref=f4e575]: var
            - text: "curve = FPAnimationCurveUtils.CreateLinearCurve(FPAnimationCurve.WrapMode.Clamp, FPAnimationCurve.WrapMode.Clamp); // It can also be used directly to pre-initialise a curve in an asset public unsafe partial class CollectibleData { public FPAnimationCurve myCurve = FPAnimationCurveUtils.CreateLinearCurve(FPAnimationCurve.WrapMode.Clamp, FPAnimationCurve.WrapMode.Clamp); }"
          - heading "Baking Unity's AnimationCurve into a FPAnimationCurve" [level=3] [ref=f4e576]
          - paragraph [ref=f4e577]:
            - text: The snippets needed for converting a regular Unity
            - code [ref=f4e578]: AnimationCurve
            - text: into an
            - code [ref=f4e579]: FPAnimationCurve
            - text: can be found
            - link "HERE" [ref=f4e580] [cursor=pointer]:
              - /url: /quantum/v3/concepts-and-patterns/animation-curves-baking
            - text: .
          - paragraph [ref=f4e581]:
            - text: Last updated on
            - time [ref=f4e582]: 25/09/2026
          - link "Back to top" [ref=f4e583] [cursor=pointer]:
