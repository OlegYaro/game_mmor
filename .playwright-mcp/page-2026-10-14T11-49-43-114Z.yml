          - paragraph [ref=f4e413]: This snippet can be used to create a FP converter window in Unity for convient conversion.
          - paragraph [ref=f4e414]: C#
          - code [ref=f4e416]:
            - text: using System; using UnityEditor; using
            - generic [ref=f4e417]: Photon.Deterministic
            - text: "; public class FPConverter :"
