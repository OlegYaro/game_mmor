            - generic [ref=f8e304]:
              - text: "This document is about:"
              - strong [ref=f8e305]: QUANTUM 2
            - generic [ref=f8e306] [cursor=pointer]: SWITCH TO
        - generic [ref=f8e310]:
          - heading "Cheat Protection" [level=1] [ref=f8e311]
          - heading "Introduction" [level=2] [ref=f8e312]
          - paragraph [ref=f8e313]: Security and cheat-protection are important aspects of online multiplayer games. Quantum's determinism offers unique features to address them. This page dives into the details on the built-in protection and offers best-practices to create production-ready online games with Photon Quantum.
          - paragraph [ref=f8e314]: It is crucial for developers to be aware of all security related issues and the steps to mitigated those as well as at which time these should be taken. Although it is possible to run the full simulation on the server, it extremely rare this is sensible from a practical and cost perspective.
          - list [ref=f8e315]:
            - listitem [ref=f8e316]: Running servers is costly especially when the game does not generate revenue, yet.
            - listitem [ref=f8e317]: In a most cases cheaters only make up a very small portion of the user base.
            - listitem [ref=f8e318]: Making a game 100% cheat proof is an utopian idea, even keeping just one step ahead of them is a huge task.
            - listitem [ref=f8e319]: There are game genres which rely on as much security as possible.
          - paragraph [ref=f8e326]:
            - text: "The single most important advice is: write the game"
            - strong [ref=f8e327]: now
            - text: and add these more complex safety checks
            - strong [ref=f8e328]: incrementally
            - text: . It is perfectly viable to go live without a custom server and be successful.
          - paragraph [ref=f8e329]: "In the documentation the following terms are used:"
          - list [ref=f8e330]:
            - listitem [ref=f8e331]:
              - text: a
              - strong [ref=f8e332]: game backend
              - text: refers to online services created and hosted by the customer;
            - listitem [ref=f8e333]:
              - text: a
              - strong [ref=f8e334]: custom server (/plugin)
              - text: refers to a customer-customized Quantum plugin hosted by Photon; and,
            - listitem [ref=f8e335]:
              - strong [ref=f8e336]: Quantum Public Cloud
              - text: refers to non-customized Quantum servers hosted by Photon.
          - heading "Cheat Protection By Determinism" [level=2] [ref=f8e337]
          - paragraph [ref=f8e338]:
            - text: The huge upside of a deterministic game, even without the server running the simulation, is its cheat-robustness; if one player modifies their client, for example by changing their character's speed, it will
            - strong [ref=f8e339]: not affect any other player
            - text: . They might notice the cheating player behaving strangely (e.g. continuously bumping into a wall) but otherwise their experience remains untainted.
          - paragraph [ref=f8e340]: "The reason for this is simple: each client deterministically runs the complete simulation locally and only shares input with other clients."
          - heading "Trustable Match Results" [level=2] [ref=f8e341]
          - paragraph [ref=f8e342]: A match result is used to update the player progression in a game backend. In the most secure scenarios this is done from the server where the game logic ran.
          - paragraph [ref=f8e343]: However, there are a few iterations possible to secure the results in a cost-efficient way before going towards an authoritative game server.
          - table [ref=f8e344]:
            - rowgroup [ref=f8e348]:
              - row [ref=f8e349]:
                - rowheader "Prototyping" [ref=f8e350]
                - cell "Clients push their individual results to the developers game backend. This is good for prototyping and games can also launch with this setup. Having a data structure which can be filled with the results to be sent to a backend is the first thing to have." [ref=f8e351]
              - row [ref=f8e352]:
                - rowheader "Majority Vote" [ref=f8e353]
                - cell "Clients push the match result individually but the backend choses the result based on a majority vote. Outliers that send (potentially) tampered data can be identified. There is no need to wait for a confirmation on the clients, just display them their result right away and save the progression only _after_ having had it validated on the backend." [ref=f8e354]
              - row [ref=f8e355]:
                - rowheader "Resimulation Replays" [ref=f8e356]
                - cell "If there is no agreement via the majority vote or a statistical evaluation smell, flag the match for a revalidation and collect the input history of the players. With the input history, the config files and the asset database the Quantum simulation can run outside Unity to recheck the result (replay). See the quantum-console-runner project in the Quantum SDK and read the following section on how to access the replay data." [ref=f8e357]
              - row [ref=f8e358]:
                - rowheader "Self-Hosted Spectators Referee" [ref=f8e359]
                - cell "Use a referee spectator, a .Net application, which can connect to live matches and run the simulation simultaneously, then submit the final results from it rather than letting the players send it." [ref=f8e360]
              - row [ref=f8e361]:
                - rowheader "Custom Quantum Server" [ref=f8e362]
                - cell "Run the simulation on the server and submit its result (see the quantum-custom-plugin SDK)." [ref=f8e363]
          - heading "How To Access The Replay Data" [level=3] [ref=f8e364]
          - paragraph [ref=f8e365]:
            - emphasis [ref=f8e366]: Quantum 2.1 and earlier
          - list [ref=f8e367]:
            - listitem [ref=f8e368]: Request to be send by a client
            - listitem [ref=f8e369]: Send from the Self-Hosted Spectators Referee
            - listitem [ref=f8e370]: Send from the Custom Quantum Server
          - paragraph [ref=f8e371]:
            - emphasis [ref=f8e372]: Quantum 3.0. (planned)
          - list [ref=f8e373]:
            - listitem [ref=f8e374]: Configurable webhook for Quantum Public Cloud users to stream the verified input history to another backend
          - heading "Self-Hosted Spectators Referee" [level=3] [ref=f8e375]
          - paragraph [ref=f8e376]:
            - text: The Quantum simulation can be joined as a
            - code [ref=f8e377]: spectator
            - text: ; a spectator is a client which can connect to the server and run the full game without the ability of sending input. This can be used to start and initialize the game from a trusted source.
          - list [ref=f8e378]:
            - listitem [ref=f8e379]: Create a spectator application (runs outside Unity).
            - listitem [ref=f8e380]: Run it anywhere to communicate securely with the game backend to start and prepare a Photon room.
            - listitem [ref=f8e381]: Start a Quantum game.
            - listitem [ref=f8e382]: Let other clients late-join the simulation (see the quantum-console-spectator project in the Quantum SDK).
          - paragraph [ref=f8e389]: Adding another, artificial client to the Photon Room for spectating purposes will increase the CCU count, which is the basis for the server cost. This might be a problem for games with low player counts (1vs1) as increases the CCU count perceptibly.
          - heading "Custom Quantum Server" [level=3] [ref=f8e390]
          - paragraph [ref=f8e391]: "Running custom code on the Quantum server requires renting Photon Enterprise servers. It will enable authority over the following aspects:"
          - list [ref=f8e392]:
            - listitem [ref=f8e393]:
              - text: Option to run the
              - strong [ref=f8e394]: game simulation on the server
              - text: "to:"
              - list [ref=f8e395]:
                - listitem [ref=f8e396]:
                  - text: Have a trusting source for
                  - strong [ref=f8e397]: game results
                - listitem [ref=f8e398]:
                  - text: Enable
                  - strong [ref=f8e399]: server snapshots
                  - text: (are send by clients when using the Public Quantum Cloud)
            - listitem [ref=f8e400]:
              - text: Option to inject
              - strong [ref=f8e401]: server controlled secrets
              - text: into the game (server command)
            - listitem [ref=f8e402]:
              - text: Option to intercept and
              - strong [ref=f8e403]: replace
              - code [ref=f8e404]: DeterministicConfig
              - text: ","
              - code [ref=f8e405]: RuntimeConfig
              - text: and
              - code [ref=f8e406]: RuntimePlayer
            - listitem [ref=f8e407]:
              - text: Option to
              - strong [ref=f8e408]: save validated replays
          - heading "Protect Client-Controlled Game Configs" [level=2] [ref=f8e409]
          - paragraph [ref=f8e410]:
            - text: Two important
            - strong [ref=f8e411]: shared configuration files are sent by the clients
            - text: "in the beginning of a match:"
            - code [ref=f8e412]: DeterministicConfig
            - text: (Quantum settings) and
            - code [ref=f8e413]: RuntimeConfig
            - text: (game settings). The server will accept the first ones (DeterministicConfig, RuntimeConfig) it receives which is more or less random in the most cases.
          - paragraph [ref=f8e414]:
            - text: "Clients also sending another config which is describing the player loadout:"
            - code [ref=f8e415]: RuntimePlayer
            - text: . To verify it against the player progression saved on a backend a custom Quantum server plugin is required.
          - table [ref=f8e416]:
            - rowgroup [ref=f8e420]:
              - row [ref=f8e421]:
                - rowheader "Public Quantum Cloud" [ref=f8e422]
                - cell [ref=f8e423]:
                  - text: Chooses a random source for
                  - code [ref=f8e424]: DeterministicConfig
                  - text: and
                  - code [ref=f8e425]: RuntimeConfig
              - row [ref=f8e426]:
                - rowheader "Custom Quantum Server" [ref=f8e427]
                - cell "All configs can be intercepted and replaced after retrieving it from the developers backend" [ref=f8e428]
              - row [ref=f8e429]:
                - rowheader "Dashboard (coming in Quantum 3.0)" [ref=f8e430]
                - cell [ref=f8e431]:
                  - code [ref=f8e432]: DeterministicConfig
                  - text: can be forced on Public Cloud server by associating it with an AppId inside the Photon dashboard.
              - row [ref=f8e433]:
                - rowheader "Webhooks (coming in Quantum 3.0)" [ref=f8e434]
                - cell [ref=f8e435]:
                  - code [ref=f8e436]: RuntimeConfig
                  - text: and
                  - code [ref=f8e437]: RuntimePlayer
                  - text: can be verified by the developers backend calling a
                  - code [ref=f8e438]: webrequest
                  - text: configured on the Photon dashboard.
          - heading "Custom Authentication" [level=2] [ref=f8e439]
          - paragraph [ref=f8e440]:
            - text: We do not offer an authentication service nor a player database ourselves but we absolutely recommend to add a proprietary or third-party
            - strong [ref=f8e441]: authentication service
            - text: .
          - paragraph [ref=f8e442]:
            - link "Photon Realtime Custom Authentication" [ref=f8e443] [cursor=pointer]:
              - /url: /realtime/current/connection-and-authentication/authentication/custom-authentication
          - heading "Determinism As A Drawback" [level=2] [ref=f8e444]
          - paragraph [ref=f8e445]: While Determinism has a lot of advantages, it comes with a few notable drawbacks inherent to this type of technology.
          - heading "Perfect Information Problem" [level=3] [ref=f8e446]
          - paragraph [ref=f8e447]:
            - text: With Quantum every client has access to all information required to simulation the game locally (apart from other players' input). This means
            - strong [ref=f8e448]: client controlled secrets
            - text: used in a card game and Fog Of War-like features
            - strong [ref=f8e449]: are easily hackable
            - text: .
          - paragraph [ref=f8e450]:
            - text: There are also fringe cases which let clients "guess" a
            - strong [ref=f8e451]: next random number
            - text: or the ability to
            - strong [ref=f8e452]: create bots
            - text: .
          - heading "Detecting Cheaters Using Checksums" [level=3] [ref=f8e453]
          - paragraph [ref=f8e454]: It is not recommended to use Quantum checksum detection for live games as a way to detect cheaters.
          - list [ref=f8e455]:
            - listitem [ref=f8e456]: Checksum calculation is expensive and could lead to hiccups; and,
            - listitem [ref=f8e457]:
              - text: The build-in mechanism stops the simulation for
              - strong [ref=f8e458]: every
              - text: client in the game session immediately.
          - link "Back to top" [ref=f8e459] [cursor=pointer]:
            - /url: "#"
