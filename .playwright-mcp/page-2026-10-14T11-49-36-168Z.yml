        - generic [ref=e323]:
          - heading "Replays" [level=1] [ref=e324]
          - heading "Introduction" [level=2] [ref=e325]
          - paragraph [ref=e326]: This documentation explains how to save and play back deterministic Quantum simulation replays.
          - paragraph [ref=e327]: Replays are re-runs of the game simulation using the same libraries, game assets, configurations and user input from a recorded session. They can also be used to start a second simulation that is slightly in the past to, for example, perform a kill-cam replay. The application doesn't have to be the same one or even run on the same platform, but it has to be built with the same game and Quantum dlls. Optionally checksums can be recorded with and verified during playback.
          - paragraph [ref=e328]: "Running a Quantum replay requires four parts:"
          - list [ref=e329]:
            - listitem [ref=e330]:
              - strong [ref=e331]: An application build with the same version of game and Quantum libraries
              - list [ref=e332]:
                - listitem [ref=e333]: QuantumDeterministic.dll and Quantum.Engine.dll
                - listitem [ref=e334]: Quantum.Simulation.dll
            - listitem [ref=e335]:
              - strong [ref=e336]: The game assets
              - list [ref=e337]:
                - listitem [ref=e338]: The Quantum asset database (DB)
                - listitem [ref=e339]: The Look-up-tables files (LUT)
            - listitem [ref=e340]:
              - strong [ref=e341]: The game session specific configuration files
              - list [ref=e342]:
                - listitem [ref=e343]: SimulationConfig
                - listitem [ref=e344]: RuntimeConfig
            - listitem [ref=e345]:
              - strong [ref=e346]: The game session specific input history
          - heading "How To Save A Replay" [level=2] [ref=e347]
          - heading "Unity" [level=3] [ref=e348]
          - paragraph [ref=e349]:
            - text: Before starting Quantum, set the
            - code [ref=e350]: RecordingFlags
            - text: to either
            - code [ref=e351]: Input
            - text: or
            - code [ref=e352]: All
            - text: .
          - paragraph [ref=e353]: C#
          - code [ref=e355]:
            - text: "["
            - generic [ref=e356]: Flags
            - text: "] public enum RecordingFlags { None = 0, // records nothing, default setting Input = 1 << 0, // records input Checksums = 1 << 1, // records checksums (must be enabled) All = Input | Checksums // recorded input and checksum }"
          - list [ref=e357]:
            - listitem [ref=e358]:
              - text: Use the inspector
              - code [ref=e359]: enum
              - text: field of the
              - code [ref=e360]: QuantumRunnerLocalDebug
              - text: or
          - figure "RunnerLocalDebug" [ref=e361]:
            - img "RunnerLocalDebug"
          - list [ref=e363]:
            - listitem [ref=e364]:
              - text: Use the inspector
              - code [ref=e365]: enum
              - text: field in the
              - code [ref=e366]: QuantumMenuUIController.ConnectArgs
              - text: when using the Quantum menu or
          - figure "Menu UI Controller" [ref=e367]:
            - img "Menu UI Controller"
          - list [ref=e369]:
            - listitem [ref=e370]:
              - text: Set the flags on the
              - code [ref=e371]: SessionRunner.Arguments
              - text: when calling
              - code [ref=e372]: SessionRunner.Start()
              - text: or
          - figure "SessionRunner.Arguments" [ref=e373]:
            - img "SessionRunner.Arguments"
          - list [ref=e375]:
            - listitem [ref=e376]:
              - text: Alternatively the input recording can also be started manually using
              - code [ref=e377]: QuantumGame.StartRecordingInput()
              - text: .
          - paragraph [ref=e378]: "PS: Input recording in general will create managed memory allocations."
          - paragraph [ref=e379]:
            - strong [ref=e380]: Start
            - text: the game, then save the replay by selecting one of Unity Editor menu options below. The exported file can either include the asset db for convenience or exclude the asset db to keep the replay files size small. The default replay file location is
            - code [ref=e381]: Assets/QuantumUser/Replays
            - text: . The default name consists of the current loaded map name and the datetime. It may export a second file with the
            - code [ref=e382]: "-DB"
            - text: postfix for the excluded asset db.
          - paragraph [ref=e383]:
            - code [ref=e384]: Quantum > Export > Replay (Include Asset DB)
          - paragraph [ref=e385]:
            - code [ref=e386]: Quantum > Export > Replay (Exclude Asset DB)
          - paragraph [ref=e387]: "Alternatively, create and save the replay file manually in code:"
          - paragraph [ref=e388]: C#
          - code [ref=e390]:
            - generic [ref=e391]: var
            - text: "replay = quantumGame.GetRecordedReplay(includeChecksums: true, includeDb: false); File.WriteAllText(\"replay.json\", JsonUtility.ToJson(replay));"
          - paragraph [ref=e392]: "Alternatively export the asset db in code:"
          - paragraph [ref=e393]: C#
          - code [ref=e395]:
            - text: using (
            - generic [ref=e396]: var
            - text: "file = File.Create(\"db.json\")) { quantumGame.AssetSerializer.SerializeAssets(file, quantumGame.ResourceManager.LoadAllAssets().ToArray()); }"
          - heading "Webhook" [level=3] [ref=e397]
          - paragraph [ref=e398]: To save a replay from a session running on the Quantum Public Cloud the replay webhooks must be set up and point to a custom backend.
          - list [ref=e399]:
            - listitem [ref=e400]:
              - link "Quantum Webhook - ReplayStart" [ref=e401] [cursor=pointer]:
                - /url: /quantum/v3/manual/webhooks#replaystart
            - listitem [ref=e402]:
              - link "Quantum Webhook - ReplayChunk" [ref=e403] [cursor=pointer]:
                - /url: /quantum/v3/manual/webhooks#replaychunk
          - paragraph [ref=e404]:
            - text: The start WebRequest comes with the
            - code [ref=e405]: SessionConfig
            - text: and
            - code [ref=e406]: RuntimeConfig
            - text: configuration files. The chunks will arrive frequently until
            - code [ref=e407]: IsLast
            - text: is finally
            - code [ref=e408]: "true"
            - text: ", representing the streaming input from all players."
          - paragraph [ref=e409]:
            - text: To make the replays playable in Unity, either serialize them in JSON into a
            - code [ref=e410]: QuantumReplayFile
            - text: class or create another data structure to store the required data.
          - heading "How To Run A Replay" [level=2] [ref=e411]
          - heading "Unity" [level=3] [ref=e412]
          - paragraph [ref=e413]:
            - text: Instead of the
            - code [ref=e414]: QuantumRunnerLocalDebug
            - text: script use the
            - code [ref=e415]: QuantumRunnerLocalReplay
            - text: script to start a local game using a replay. Drag and drop the recorded file into the
            - code [ref=e416]: Replay File
            - text: field of the inspector. If the default file naming convention is used it will detect and set the asset
            - code [ref=e417]: Database File
            - text: automatically. Press play.
          - figure "RunnerLocalReplay" [ref=e418]:
            - img "RunnerLocalReplay"
          - paragraph [ref=e420]: The script follows a few steps to load a replay file, set up and configure arguments and start the Quantum session. The process is similar to what the .Net application runner does and can be used to create custom replay starting logic.
          - paragraph [ref=e421]: "Step 1: Deserialize the replay file."
          - paragraph [ref=e422]: C#
          - code [ref=e424]:
            - generic [ref=e425]: var
            - text: replayFile = JsonUtility.
            - generic [ref=e426]:
              - text: FromJson
              - generic [ref=e427]: <QuantumReplayFile>
            - text: (ReplayFile.text);
          - paragraph [ref=e428]: "Step 2: Create an input provider from the replay file. It will automatically create the correct provider based on if the input is delta compressed or if it uses raw inputs."
          - paragraph [ref=e429]: C#
          - code [ref=e431]: _replayInputProvider = replayFile.CreateInputProvider();
          - paragraph [ref=e432]:
            - text: "Step 3: Create the"
            - code [ref=e433]: SessionRunner
            - text: arguments. For example, decode the binary
            - code [ref=e434]: RuntimeConfig
            - text: ", set the simulation to"
            - code [ref=e435]: DeterministicGameMode.Replay
            - text: mode.
            - code [ref=e436]: InitialTick
            - text: and
            - code [ref=e437]: FrameData
            - text: are only required if the replay does not start from the beginning.
          - paragraph [ref=e438]: C#
          - code [ref=e440]:
            - generic [ref=e441]: var
            - text: serializer = new QuantumUnityJsonSerializer();
            - generic [ref=e442]: var
            - text: runtimeConfig = serializer.
            - generic [ref=e443]:
              - text: ConfigFromByteArray
              - generic [ref=e444]: <RuntimeConfig>
            - text: "(replayFile.RuntimeConfigData.Decode(), compressed: true);"
            - generic [ref=e445]: var
            - text: arguments = new
            - generic [ref=e446]: SessionRunner.Arguments
            - text: "{ RunnerFactory = QuantumRunnerUnityFactory.DefaultFactory, RuntimeConfig = runtimeConfig, SessionConfig = replayFile.DeterministicConfig, ReplayProvider = _replayInputProvider, GameMode = DeterministicGameMode.Replay, RunnerId = \"LOCALREPLAY\", PlayerCount = replayFile.DeterministicConfig.PlayerCount, InstantReplaySettings = InstantReplayConfig, InitialTick = replayFile.InitialTick, FrameData = replayFile.InitialFrameData, DeltaTimeType = DeltaTypeType };"
          - paragraph [ref=e447]:
            - text: "Step 4: Use the asset database saved with the replay or an external asset database source or do not set a different"
            - code [ref=e448]: ResourceManager
            - text: at all.
          - paragraph [ref=e449]: C#
          - code [ref=e451]:
            - generic [ref=e452]: var
            - text: "assets = replayFile.AssetDatabaseData?.Decode(); if (DatabaseFile != null) { assets = DatabaseFile.bytes; }"
            - generic [ref=e453]: var
            - text: "serializer = new QuantumUnityJsonSerializer(); if (assets?.Length > 0) { _resourceAllocator = new QuantumUnityNativeAllocator(); _resourceManager = new ResourceManagerStatic(serializer.AssetsFromByteArray(assets), new QuantumUnityNativeAllocator()); arguments.ResourceManager = _resourceManager; }"
          - paragraph [ref=e454]: "Step 5: Finally, start the game."
          - paragraph [ref=e455]: C#
          - code [ref=e457]: _runner = QuantumRunner.StartGame(arguments);
          - paragraph [ref=e458]: Optionally start verifying a list of checksums and log out checksum mismatches.
          - paragraph [ref=e459]: C#
          - code [ref=e461]: _runner.Game.StartVerifyingChecksums(replayFile.Checksums);
          - heading ".Net Application" [level=3] [ref=e462]
          - paragraph [ref=e463]:
            - text: Create or update the .Net simulation project by selecting the
            - code [ref=e464]: QuantumDotnetBuildSettings
            - text: asset and pressing
            - code [ref=e465]: Generate Dotnet Project
            - text: .
          - paragraph [ref=e466]:
            - text: Open and compile the solution file under
            - code [ref=e467]: Assets/../Quantum.Dotnet/Quantum.Dotnet.sln
            - text: .
          - paragraph [ref=e468]: Start the runner from the command line accordingly.
          - paragraph
          - code [ref=e470]: "Quantum.Dotnet\\Quantum.Runner.Dotnet\\bin\\Debug> .\\Quantum.Runner.exe --help Description: Main method to start a Quantum runner. Usage: Quantum.Runner [options] Options: --replay-path <replay-path> Path to the Quantum replay json file. --lut-path <lut-path> Path to the LUT folder. --db-path <db-path> Optionally an extra path to the Quantum database json file. --checksum-path <checksum-path> Optionally an extra path to the checksum file. --version Show version information -?, -h, --help Show help and usage information"
          - paragraph [ref=e471]: "For example:"
          - paragraph
          - code [ref=e473]: Quantum.Dotnet\Quantum.Runner.Dotnet\bin\Debug>.\Quantum.Runner.exe --replay-path ..\..\..\..\Assets\QuantumUser\Replays\MapTestNavMeshAgents-2024-06-17-14-19-46.json --lut-path ..\..\..\..\Assets\Photon\Quantum\Resources\LUT
          - paragraph [ref=e474]:
            - strong [ref=e475]: "Caveat:"
            - text: Recorded checksums in Unity are not compatible with the ones generated in the Dotnet runner. Activate
            - code [ref=e476]: ChecksumCrossPlatformDeterminism
            - text: in the SessionConfig to validate recorded checksums on different platforms.
          - heading "PlayerIsLocal()" [level=2] [ref=e477]
          - paragraph [ref=e478]:
            - text: The PlayerIsLocal-check on
            - code [ref=e479]: Quantum.Game.Session
            - text: is good for numerous view control for example camera, audio and VFX focus.
            - strong [ref=e480]: But
            - text: it won't work for replays.
          - paragraph [ref=e481]: Replays captured online using the webhook for example will never have this information.
          - paragraph [ref=e482]: To support replays it is better to always wrap the PlayerIsLocal-check into checking the session game mode first.
          - paragraph [ref=e483]: C#
          - code [ref=e485]:
            - text: "public class CustomViewContext :"
            - generic [ref=e486]: MonoBehaviour, IQuantumViewContext
            - text: "{ private PlayerRef _focusedPlayer; public"
            - generic [ref=e487]: bool
            - text: "IsFocusedPlayer(QuantumGame game, PlayerRef player) { if (game.Session.GameMode == DeterministicGameMode.Replay) { return player == _focusedPlayer; } return game.PlayerIsLocal(player); } }"
          - heading "QuantumReplayFile API" [level=2] [ref=e488]
          - paragraph [ref=e489]:
            - text: The
            - code [ref=e490]: QuantumReplayFile
            - text: holds all relevant data to run a Quantum replay and can be serialized in JSON.
          - paragraph [ref=e491]:
            - text: The replay has to include a valid input history saved as
            - code [ref=e492]: InputHistoryDeltaCompressed
            - text: or
            - code [ref=e493]: InputHistoryLegacy
            - text: . The former is much more files size friendly and is the only mode that input is streamed from the Photon Public Cloud.
          - paragraph [ref=e494]:
            - text: The
            - code [ref=e495]: RuntimeConfigData
            - text: is stored in a binary serialized form (Quantum.AssetSerializer) like the data that is received during replay streaming.
          - paragraph [ref=e496]:
            - text: The replay may include a serialized (AssetSerializer) asset db
            - code [ref=e497]: AssetDatabaseData
            - text: for convenience, which should be omitted in production environments where file size is an issue.
          - paragraph [ref=e498]: The replay may contain recorded checksums that can be verified at runtime as a development feature.
          - paragraph [ref=e499]:
            - text: The
            - code [ref=e500]: QuantumJsonFriendlyDataBlob
            - text: is a wrapper around storing binary data in JSON to work around the problem that Unity JSON tools only serialize byte arrays verbosely.
          - paragraph [ref=e501]: C#
          - code [ref=e503]:
            - text: "public class QuantumReplayFile { // Delta compressed binary input history, this is the same that is send over replay webhooks for example. public QuantumJsonFriendlyDataBlob InputHistoryDeltaCompressed; // Full verbose input used in Quantum 2.1, which is still functional, but has only fringe use cases. public"
            - generic [ref=e504]: DeterministicTickInputSet[]
            - text: "InputHistoryLegacy; // Binary serialized RuntimeConfig. // Use AssetSerializer.ConfigToByteArray(runtimeConfig, compress: true) /// </summary> public QuantumJsonFriendlyDataBlob RuntimeConfigData; /// The session config. public DeterministicSessionConfig DeterministicConfig; /// The last tick of the input. public"
            - generic [ref=e505]: int
            - text: LastTick; /// The initial tick to start from, requires <see cref="InitialFrameData"/> to be set. public
            - generic [ref=e506]: int
            - text: InitialTick; /// Optional frame data to start the replay with. This is used for save games for example. public
            - generic [ref=e507]: byte[]
            - text: "InitialFrameData; /// Optional checksums. Omit this for replays in production environments. public ChecksumFile Checksums; /// Optional serialized asset database. Omit this for replays in production environments. /// Use AssetSerializer.SerializeAssets(stream, ResourceManager.LoadAllAssets().ToArray() public QuantumJsonFriendlyDataBlob AssetDatabaseData; }"
          - paragraph [ref=e508]: C#
          - code [ref=e510]:
            - text: "public class QuantumJsonFriendlyDataBlob { /// The byte array is saved as is. public"
            - generic [ref=e511]: byte[]
            - text: Binary; /// The byte array is saved as Base64 text. public
            - generic [ref=e512]: string
            - text: Base64; /// Both Binary and Base64 can be GZip compressed. public
            - generic [ref=e513]: bool
            - text: "IsCompressed; }"
          - heading "Instant Replays" [level=2] [ref=e514]
          - paragraph [ref=e515]:
            - text: We provide a script which demonstrates how to do instant replays, like kill-cam replays which happen during the game, in an auxiliary QuantumRunner, and then gets back to the default runner once the instant replay is over. To use it, just add the Unity component called
            - code [ref=e516]: QuantumInstantReplayDemo
