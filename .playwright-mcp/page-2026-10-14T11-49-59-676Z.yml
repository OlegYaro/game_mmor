        - generic [ref=f12e217]:
          - heading "Quantum 3 Intro" [level=1] [ref=f12e218]
          - heading "Overview" [level=2] [ref=f12e219]
          - paragraph [ref=f12e220]: Quantum is a high-performance deterministic ECS (Entity Component System) framework for online multiplayer games made with Unity, for up to 128 players.
          - paragraph [ref=f12e221]: Using predict/rollback networking, it is both ideal for latency-sensitive online games like sports games, fighting games, & FPS and also robust when faced with larger latency network connections.
          - paragraph [ref=f12e222]:
            - text: Quantum is free for development. Start building today, launch a game and pay only when its success grows beyond our free tier.
            - link "Quantum's pricing" [ref=f12e223] [cursor=pointer]:
              - /url: https://www.photonengine.com/quantum/pricing
            - text: enables small titles to grow big.
          - figure "Quantum helps developers write clean code. It decouples simulation logic (Quantum ECS) from the view/presentation (Unity), and takes care of the network implementations specifics (predict/rollback + transport layer + game agnostic server logic)." [ref=f12e224]:
            - img "Quantum helps developers write clean code. It decouples simulation logic (Quantum ECS) from the view/presentation (Unity), and takes care of the network implementations specifics (predict/rollback + transport layer + game agnostic server logic)." [ref=f12e225]
          - paragraph [ref=f12e227]: "The state-of-the-art tech stack is composed of the following pieces:"
          - list [ref=f12e228]:
            - listitem [ref=f12e229]: Server-managed predict/rollback simulation core.
            - listitem [ref=f12e230]: Sparse-set ECS memory model and API.
            - listitem [ref=f12e231]: Complete set of deterministic libraries (math, 2D and 3D physics, navigation, animation, bots, etc.).
            - listitem [ref=f12e232]: Rich Unity editor integration and tooling.
          - paragraph [ref=f12e233]: All built on top of mature and industry-proven existing Photon products and infrastructure (photon realtime transport layer, photon server plugin to host server logic, etc.);
          - heading "Predict / Rollback Networking" [level=3] [ref=f12e234]
          - paragraph [ref=f12e235]: In deterministic systems, game clients only exchange player input with the simulation running locally on all clients.
          - paragraph [ref=f12e236]: Game clients are free to advance the simulation locally using input prediction, and an advanced rollback system takes care of restoring game state and re-simulating any mispredictions. The developer defines the player inputs which will be distributed to all clients and doesn’t write any other networking code.
          - paragraph [ref=f12e237]: Quantum uses a game-agnostic authoritative server component, running on our photon servers, to synchronize clocks and manage input latency. Clients never need to wait for a slower client or a client with a worse network connection as they would in lockstep networking.
          - paragraph [ref=f12e238]: This server component can be extended to integrate with customer hosted back-end systems, e.g. matchmaking, player services, authoritative ‘referee’ simulation.
          - figure "In Quantum, input exchange is managed via game-agnostic server logic." [ref=f12e239]:
            - img "In Quantum, input exchange is managed via game-agnostic server logic." [ref=f12e240]
          - paragraph [ref=f12e242]: The Quantum client library communicates with Quantum server and runs local simulation, performing all input prediction and rollbacks.
          - paragraph [ref=f12e243]: "Custom game code is written by the developer as an isolated, pure C# simulation, using the Quantum ECS, which is decoupled from Unity. Quantum's interface offers a great range of deterministic APIs that can be reused in any game. For example: vector math, 2D and 3D physics engines, navigation pathfinder, animation, bots."
          - heading "Entity Component System" [level=2] [ref=f12e244]
          - paragraph [ref=f12e245]: To enable all the simulation code to be high-performance out of the box, Quantum is based on a high performance sparse-set Entity Component System (ECS) model.
          - paragraph [ref=f12e246]: The key to Quantum's performance is the use of pointer-based C# code combined with its custom heap allocator. The simulation code allocates no C# heap memory at runtime and creates no garbage.
          - paragraph [ref=f12e247]: Even including the re-simulations caused by input mispredictions, which are inherent to the predict/rollback approach, the goal is to leave most of the CPU budget for the view/rendering code, i.e. Unity.
          - heading "Code Generation" [level=3] [ref=f12e248]
          - paragraph [ref=f12e249]: In Quantum, all gameplay data (game state) is kept either in the sparse-set ECS data structures (entities and components) or in our custom heap-allocator (dynamic collections and custom data), as blittable memory-aligned C# structs.
          - paragraph [ref=f12e250]: Pointer-based C# is used by Quantum, for performance. Complexity and boiler-plate code is hidden from the developer by using a simple domain specific language (DSL), called Qtn, to automatically generate C# code for game data.
          - paragraph [ref=f12e251]: Qtn
          - code [ref=f12e253]: "// components define reusable game state data groups component Resources { Int32 Mana; FP Health; }"
          - paragraph [ref=f12e254]: Structs, C-style unions, enums, flags, bitsets, lists, and dictionaries, etc, can also be defined and used.
          - paragraph [ref=f12e255]: "The auto-generated API makes it easy to query and modify the game state with comprehensive functions to iterate, modify, create or destroy entities (based on their components):"
          - paragraph [ref=f12e256]: C#
          - code [ref=f12e258]:
            - generic [ref=f12e259]: var
            - text: es = frame.
            - generic [ref=f12e260]:
              - text: Filter
              - generic [ref=f12e261]: <Transform3D, Resources>
            - text: (); // sets the entity ref and pointers to the components while (es.NextUnsafe(out
            - generic [ref=f12e262]: var
            - text: entity, out
            - generic [ref=f12e263]: var
            - text: transform, out
            - generic [ref=f12e264]: var
            - text: "resources)) { transform->Position += FPVector3.Forward * frame.DeltaTime; }"
          - heading "Stateless Systems" [level=3] [ref=f12e265]
          - paragraph [ref=f12e266]: While Quantum's DSL covers data definition, there needs to be a way to organize the custom game logic that will update this game state.
          - paragraph [ref=f12e267]: Customer game logic is written by implementing Systems, which are stateless pieces of logic that will be executed every tick update by Quantum's client simulation loop. All the game state is stored in the Frame, which is passed into the Update() function.
          - paragraph [ref=f12e268]: C#
          - code [ref=f12e270]:
            - text: "public unsafe class LogicSystem :"
            - generic [ref=f12e271]: SystemMainThread
            - text: "{ public override"
            - generic [ref=f12e272]: void
            - text: "Update(Frame frame) { // customer game logic here // (frame is a reference for the generated game state container). } }"
          - heading "Quantum and Unity" [level=2] [ref=f12e273]
          - paragraph [ref=f12e274]: "Since Quantum and Unity are decoupled, communication into and out of the Quantum Simulation is well defined:"
          - figure "Quantum Inputs and Outputs" [ref=f12e275]:
            - img "Quantum Inputs and Outputs"
          - heading "Asset Database" [level=3] [ref=f12e277]
          - paragraph [ref=f12e278]:
            - text: Unity is known for its flexible editor and asset pipeline.
            - link "Assets are defined in Quantum" [ref=f12e279] [cursor=pointer]:
              - /url: /quantum/v3/manual/assets/assets-simulation
            - text: ", then may be"
            - link "created within Unity" [ref=f12e280] [cursor=pointer]:
              - /url: /quantum/v3/manual/assets/assets-unity
            - text: "specifically to be shared with Quantum, allowing game and level designers to work as flexibly as they normally would in Unity:"
          - figure "Example of a Quantum Asset for a character which is created & modified in the Unity Editor." [ref=f12e281]:
            - img "Example of a Quantum Asset for a character which is created & modified in the Unity Editor."
          - paragraph [ref=f12e283]: These assets are also available in the Unity code, of course.
          - heading "Input" [level=3] [ref=f12e284]
          - paragraph [ref=f12e285]:
            - link "Input" [ref=f12e286] [cursor=pointer]:
              - /url: /quantum/v3/manual/input
            - text: must be defined and is sent to the server and distributed to all game clients every tick. This would typically be the subset of keyboard or controller buttons and mouse or controller stick positions required by the game.
          - heading "Commands" [level=3] [ref=f12e287]
          - paragraph [ref=f12e288]:
            - link "Commands" [ref=f12e289] [cursor=pointer]:
              - /url: /quantum/v3/manual/commands
            - text: are intended for occasional actions. They are only sent when required.
          - heading "Events" [level=3] [ref=f12e290]
          - paragraph [ref=f12e291]:
            - link "Events" [ref=f12e292] [cursor=pointer]:
              - /url: /quantum/v3/manual/quantum-ecs/game-events
            - text: are a way to transfer information from the Quantum simulation to the Unity view.
          - heading "Full Simulation State" [level=3] [ref=f12e293]
          - paragraph [ref=f12e294]:
            - text: The full simulation state from Quantum is observable from Unity. Common cases, for example synchronizing the transforms of GameObjects to their corresponding Entities in Quantum, we support out of the box.
            - link "See Entity Prototypes" [ref=f12e295] [cursor=pointer]:
              - /url: /quantum/v3/manual/entity-prototypes
            - text: . For game-specific items e.g. character health this can be simply read from the simulation state for the game to display.
          - heading "Where to go next" [level=2] [ref=f12e296]
          - paragraph [ref=f12e297]:
            - text: To get started with Quantum we strongly recommend beginning with the
            - link "Asteroids Tutorial" [ref=f12e298] [cursor=pointer]:
              - /url: /quantum/v3/tutorials/asteroids/1-overview
            - text: . This tutorial teaches you all the necessary basics to get started with Quantum.
          - paragraph [ref=f12e299]:
            - text: For a video tutorial there is also the
            - link "Complete Course to Quantum 3" [ref=f12e300] [cursor=pointer]:
              - /url: /quantum/v3/tutorials/video-tutorial
            - text: stream.
          - paragraph [ref=f12e301]:
            - text: To dive right in at a more advanced level we recommend the first pages you should read in the manual are the ones covering the Quantum
            - link "DSL" [ref=f12e302] [cursor=pointer]:
              - /url: /quantum/v3/manual/quantum-ecs/dsl
            - text: (Domain Specific Language) and the
            - link "Entity Prototypes" [ref=f12e303] [cursor=pointer]:
              - /url: /quantum/v3/manual/entity-prototypes
            - text: . These are at the core of programming the simulation and designing the view, respectively.
          - paragraph [ref=f12e304]:
            - text: Alternatively there are many
            - link "Game Samples" [ref=f12e305] [cursor=pointer]:
              - /url: /quantum/v3/game-samples/platform-shooter-2d/overview
            - text: to download.
          - paragraph [ref=f12e306]:
            - text: Last updated on
            - time [ref=f12e307]: 21/07/2026
