name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Game.sln -c Release --nologo

      # Time-limited benchmarks are excluded here: coverlet instrumentation slows the code down (2048x2048 generation
      # takes ~9 s instead of ~6 s against an 8 s limit) and shared runners are slower still. They run in the
      # `benchmarks` job below, without coverage. The bot simulation runs in the `simulation` job.
      - name: Test with coverage
        run: dotnet test tests/Core.Tests/Core.Tests.csproj -c Release --no-build --nologo --filter "Category!=Benchmark&Category!=Simulation" --collect:"XPlat Code Coverage" --settings tests/Core.Tests/coverage.runsettings --results-directory TestResults

      - name: Schemas up to date
        shell: bash
        run: |
          dotnet run --project tools/SchemaGen/SchemaGen.csproj -c Release --nologo
          git diff --exit-code data/schema

      - name: Coverage report (ReportGenerator, 70% line threshold)
        if: matrix.os == 'macos-latest'
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/report -reporttypes:"Html;JsonSummary"
          $line = (Get-Content TestResults/report/Summary.json -Raw | ConvertFrom-Json).summary.linecoverage
          Write-Host "Line coverage: $line%"
          if ($line -lt 70) { Write-Error "Line coverage $line% is below 70%"; exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  benchmarks:
    name: benchmarks (${{ matrix.os }}, informational)
    runs-on: ${{ matrix.os }}
    # Shared runners have noisy timing, so a slow run must not turn the whole CI red.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Core.Tests/Core.Tests.csproj -c Release --nologo

      - name: Benchmarks (no coverage)
        run: dotnet test tests/Core.Tests/Core.Tests.csproj -c Release --no-build --nologo --filter "Category=Benchmark"

  simulation:
    name: bot simulation (${{ matrix.os }}, informational)
    runs-on: ${{ matrix.os }}
    # The 100-day bot runs compare against golden CSVs; a balance drift must not turn the whole CI red.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Core.Tests/Core.Tests.csproj -c Release --nologo

      - name: Bot simulation (no coverage)
        run: dotnet test tests/Core.Tests/Core.Tests.csproj -c Release --no-build --nologo --filter "Category=Simulation"

  smoke:
    name: smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Smoke test
        run: tools/smoke.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-logs
          path: .tools/logs
          if-no-files-found: ignore
